        const renderLatex = (text) => {
            if (!text) return "";
            const parts = text.split(/(\$[^\$]+\$)/g);
            return parts.map((part, index) => {
                if (typeof part === 'string' && part.startsWith("$") && part.endsWith("$")) {
                    const math = part.slice(1, -1);
                    const formatted = math
                        .replace(/\\text\{([^\}]+)\}/g, "$1")
                        .replace(/\\circ/g, "°")
                        .replace(/\\times/g, "×")
                        .replace(/--/g, "–")
                        .replace(/\\beta/g, "β")
                        .replace(/\\alpha/g, "α")
                        .replace(/\\gamma/g, "γ")
                        .replace(/\\delta/g, "δ")
                        .replace(/\\mu/g, "μ");
                    return (
                        <span key={index} className="font-serif italic bg-emerald-50 text-emerald-800 px-1 py-0.2 rounded border border-emerald-100 font-semibold text-xs whitespace-nowrap">
                            {formatted}
                        </span>
                    );
                }
                return part;
            });

                                if (item && item.id) {
                                    savedMap[item.id] = item;
                                }

                                        gallery: Array.isArray(savedItem.gallery) ? savedItem.gallery : (template.gallery || [])
                                    };
                                }
                                return template;
                            });
                        }

                return INITIAL_SEEDS_DATA;

            useEffect(() => {

            const showToast = (message, type = "success") => {
                setNotification({ message, type });
                setTimeout(() => setNotification(null), 4000);
            };

            const requestSort = (key) => {
                let direction = 'ascending';
                if (sortConfig && sortConfig.key === key && sortConfig.direction === 'ascending') {
                    direction = 'descending';
                }
                setSortConfig({ key, direction });
            };

            // Map seasons to numbers for chronological Australian season sorting
            const SEASON_SORT_ORDER = {
                "Summer": 1,
                "Autumn": 2,
                "Winter": 3,
                "Spring": 4
            };

            const filteredSeeds = useMemo(() => {
                let result = seeds.filter(seed => {
                    const matchesSearch = 
                        seed.scientificName.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        seed.commonName.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        (seed.notes && seed.notes.toLowerCase().includes(searchQuery.toLowerCase())) ||
                        seed.floweringTime.toLowerCase().includes(searchQuery.toLowerCase());

                    const matchesGenus = selectedGenus === 'All' || seed.genus === selectedGenus;
                    const matchesStatus = selectedStatus === 'All' || seed.status === selectedStatus;
                    const matchesPretreatment = selectedPretreatment === 'All' || seed.pretreatment === selectedPretreatment;

                    return matchesSearch && matchesGenus && matchesStatus && matchesPretreatment;
                });

                if (sortConfig !== null) {
                    result.sort((a, b) => {
                        let aValue = a[sortConfig.key];
                        let bValue = b[sortConfig.key];

                        // Special Chronological Sort for Flowering Times
                        if (sortConfig.key === 'floweringTime') {
                            const getSeasonRank = (str) => {
                                if (!str) return 99;
                                const firstWord = str.split(' ')[0];
                                return SEASON_SORT_ORDER[firstWord] || 99;
                            };
                            aValue = getSeasonRank(a.floweringTime);
                            bValue = getSeasonRank(b.floweringTime);
                        }

                        if (sortConfig.key === 'conservation') {
                            aValue = a.conservation ? a.conservation.status : 'Least Concern';
                            bValue = b.conservation ? b.conservation.status : 'Least Concern';
                        }

                        if (aValue === undefined || aValue === null) return 1;
                        if (bValue === undefined || bValue === null) return -1;

                        if (aValue.toString().toLowerCase() < bValue.toString().toLowerCase()) {
                            return sortConfig.direction === 'ascending' ? -1 : 1;
                        }
                        if (aValue.toString().toLowerCase() > bValue.toString().toLowerCase()) {
                            return sortConfig.direction === 'ascending' ? 1 : -1;
                        }
                        return 0;
                    });
                }
                return result;
            }, [seeds, searchQuery, selectedGenus, selectedStatus, selectedPretreatment, sortConfig]);

            const getSortIndicator = (key) => {
                if (!sortConfig || sortConfig.key !== key) {
                    return <span className="text-slate-300 ml-1 text-[10px]">↕</span>;
                }
                return sortConfig.direction === 'ascending' 
                    ? <span className="text-emerald-700 ml-1 text-[10px]">▲</span> 
                    : <span className="text-emerald-700 ml-1 text-[10px]">▼</span>;
            };

            const handleCellChange = (rowId, field, value) => {
                setSeeds(prev => prev.map(seed => {
                    if (seed.id === rowId) {
                        let updated = { ...seed, [field]: value };
                        if (field === 'scientificName') {
                            const firstWord = value.trim().split(' ')[0];
                            updated.genus = firstWord.charAt(0).toUpperCase() + firstWord.slice(1).toLowerCase();
                        }
                        if (activeProfileSeed?.id === rowId) {
                            setActiveProfileSeed(prevProfile => ({ ...prevProfile, [field]: value }));
                        }
                        return updated;
                    }
                    return seed;
                }));
            };

            // Capture missing file load exceptions gracefully
            const handleImageError = (seedId) => {
                setBrokenImages(prev => ({ ...prev, [seedId]: true }));
            };

            const processLocalImageUpload = (e, seed, isGallery = false) => {
                const file = e.target.files[0];
                if (!file) return;

                const extension = file.name.split('.').pop() || 'jpg';
                const cleanBotanical = seed.scientificName
                    .toLowerCase()
                    .replace(/ ssp\./gi, '')
                    .replace(/ var\./gi, '')
                    .replace(/\./gi, '')
                    .replace(/\s+/g, '_');

                let targetFilename = "";
                let targetRelativePath = "";

                if (isGallery) {
                    const stamp = Date.now();
                    targetFilename = `${cleanBotanical}_${galleryCategory.toLowerCase()}_${stamp}.${extension}`;
                    targetRelativePath = `images/${targetFilename}`;

                    // Update session previews map so it instantly renders in React
                    const temporaryObjectUrl = URL.createObjectURL(file);
                    setSessionPreviews(prev => ({ ...prev, [targetRelativePath]: temporaryObjectUrl }));

                    const newPhoto = {
                        id: stamp.toString(),
                        url: targetRelativePath,
                        caption: galleryCaption.trim() || `${galleryCategory} Photo`,
                        category: galleryCategory
                    };

                    setSeeds(prev => prev.map(s => {
                        if (s.id === seed.id) {
                            const updatedGallery = s.gallery ? [...s.gallery, newPhoto] : [newPhoto];
                            const updated = { ...s, gallery: updatedGallery };
                            setActiveProfileSeed(updated);
                            return updated;
                        }
                        return s;
                    }));

                    setGalleryCaption('');
                } else {
                    targetFilename = `${cleanBotanical}_main.${extension}`;
                    targetRelativePath = `images/${targetFilename}`;

                    // Set up temporary session state preview URL
                    const temporaryObjectUrl = URL.createObjectURL(file);
                    setSessionPreviews(prev => ({ ...prev, [targetRelativePath]: temporaryObjectUrl }));
                    
                    // Clear out any registered loading errors for this path
                    setBrokenImages(prev => ({ ...prev, [seed.id]: false }));

                    handleCellChange(seed.id, 'imageUrl', targetRelativePath);
                }

                // Programmatically trigger a browser download to automatically rename the file
                const binaryUrl = URL.createObjectURL(file);
                const clicker = document.createElement("a");
                clicker.href = binaryUrl;
                clicker.download = targetFilename;
                document.body.appendChild(clicker);
                clicker.click();
                document.body.removeChild(clicker);
                URL.revokeObjectURL(binaryUrl);

                showToast(`Renamed & Downloaded: ${targetFilename}. Move it to your local 'images' folder.`, "success");
            };

            const confirmResetDatabase = () => {
                setSeeds(INITIAL_SEEDS_DATA);
                setActiveProfileSeed(null);
                setSessionPreviews({});
                setBrokenImages({});
                setShowResetConfirm(false);
                showToast("Database restored to the default 97 botanical species.", "info");
            };

            // Creation modal handlers
            const openCreationModal = () => {
                setNewSeedDraft({
                    scientificName: "",

                    germDate: "",
                    quantity: "1 packet",

                    matureHeight: "3m - 8m",
                    matureWidth: "2m - 5m",

                    flowers: "",
                    floweringTime: "Spring (Sep - Nov)",
                    soilPreference: "Well-drained loam",
                    frostTolerance: "Moderate",
                    droughtTolerance: "High",

                    scientificName: newSeedDraft.scientificName.trim(),
                    commonName: newSeedDraft.commonName.trim() || "New Common Name",
                    genus: calculatedGenus,
                    pretreatment: newSeedDraft.pretreatment,
                    germination: newSeedDraft.germination || "Sow seeds on surface.",
                    status: newSeedDraft.status,
                    imageUrl: newSeedDraft.imageUrl.trim(),
                    notes: newSeedDraft.notes.trim(),
                    sowDate: newSeedDraft.sowDate,
                    germDate: newSeedDraft.germDate,
                    quantity: newSeedDraft.quantity || "1 packet",
                    growthRate: newSeedDraft.growthRate,
                    matureHeight: newSeedDraft.matureHeight || "3m - 8m",
                    matureWidth: newSeedDraft.matureWidth || "2m - 5m",

                        setActiveProfileSeed(null);

                    showToast(`${seedToDelete.name} removed from tracker.`, "info");
                    setSeedToDelete(null);

            };

            const handleExportCSV = () => {
                try {
                    const headers = ['Scientific Name', 'Common Name', 'Genus', 'Pretreatment', 'Germination Instructions', 'Progress Status', 'Sowing Date', 'Germination Date', 'Quantity', 'Notes', 'Image Link', 'Growth Rate', 'Mature Height', 'Mature Width', 'Foliage Description', 'Flower Info', 'Flowering Time', 'Soil Preference', 'Frost Tolerance', 'Drought Tolerance', 'Conservation Status', 'Conservation Locale'];
                    const rows = seeds.map(s => [
                        s.scientificName,
                        s.commonName,
                        s.genus,
                        s.pretreatment,
                        s.germination.replace(/\$/g, ''),
                        s.status,
                        s.sowDate || 'N/A',
                        s.germDate || 'N/A',
                        s.quantity,
                        s.notes || '',
                        s.imageUrl || '',
                        s.growthRate || 'Moderate',
                        s.matureHeight || 'N/A',
                        s.matureWidth || 'N/A',
                        s.foliage || '',
                        s.flowers || '',
                        s.floweringTime || 'Spring (Sep - Nov)',
                        s.soilPreference || 'Well-drained',
                        s.frostTolerance || 'Moderate',
                        s.droughtTolerance || 'High',
                        s.conservation ? s.conservation.status : "Least Concern",
                        s.conservation ? s.conservation.locale : "Aus"

                    let csvContent = "data:text/csv;charset=utf-8," 
                        + [headers.join(','), ...rows.map(e => e.map(val => `"${val.replace(/"/g, '""')}"`).join(','))].join('\n');
                    
                    const encodedUri = encodeURI(csvContent);
                    const link = document.createElement("a");
                    link.setAttribute("href", encodedUri);
                    link.setAttribute("download", "Australian_Native_Seed_Tracker_Export.csv");

                    link.click();

                                                <option value="Planted">Planted / Sown</option>
                                            </select>
                                        </div>

                                        {/* Dimensions */}
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Mature Height</label>
                                            <input 
                                                type="text" 
                                                value={newSeedDraft.matureHeight}
                                                onChange={(e) => setNewSeedDraft(prev => ({ ...prev, matureHeight: e.target.value }))}
                                                placeholder="e.g. 2m - 5m"
                                                className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 outline-none"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Mature Width</label>
                                            <input 
                                                type="text" 
                                                value={newSeedDraft.matureWidth}
                                                onChange={(e) => setNewSeedDraft(prev => ({ ...prev, matureWidth: e.target.value }))}
                                                placeholder="e.g. 2m - 4m"
                                                className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 outline-none"
                                            />
                                        </div>

                                        {/* Soil & Environmental details */}
                                        <div className="col-span-1 md:col-span-2 grid grid-cols-3 gap-2">
                                            <div>
                                                <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Soil Preference</label>
                                                <input 
                                                    type="text" 
                                                    value={newSeedDraft.soilPreference}
                                                    onChange={(e) => setNewSeedDraft(prev => ({ ...prev, soilPreference: e.target.value }))}
                                                    className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Frost Tolerance</label>
                                                <input 
                                                    type="text" 
                                                    value={newSeedDraft.frostTolerance}
                                                    onChange={(e) => setNewSeedDraft(prev => ({ ...prev, frostTolerance: e.target.value }))}
                                                    className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Drought Tolerance</label>
                                                <input 
                                                    type="text" 
                                                    value={newSeedDraft.droughtTolerance}
                                                    onChange={(e) => setNewSeedDraft(prev => ({ ...prev, droughtTolerance: e.target.value }))}
                                                    className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs"
                                                />
                                            </div>
                                        </div>

                                        {/* Conservation Section */}
                                        <div className="col-span-1 md:col-span-2 bg-slate-50 rounded-xl p-3 border border-slate-200 grid grid-cols-2 gap-2">
                                            <div className="col-span-2">
                                                <span className="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-2">Conservation Index</span>
                                            </div>
                                            <div>
                                                <label className="block text-[9px] uppercase font-bold text-slate-400 mb-1">Listing Status</label>
                                                <select 
                                                    value={newSeedDraft.conservationStatus}
                                                    onChange={(e) => setNewSeedDraft(prev => ({ ...prev, conservationStatus: e.target.value }))}
                                                    className="w-full bg-white border border-slate-200 rounded p-1.5 text-xs outline-none"
                                                >
                                                    <option value="Least Concern">Least Concern</option>
                                                    <option value="Rare">Rare</option>
                                                    <option value="Vulnerable">Vulnerable</option>
                                                    <option value="Priority Four">Priority Four</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-[9px] uppercase font-bold text-slate-400 mb-1">Sovereign Locale</label>
                                                <input 
                                                    type="text" 
                                                    value={newSeedDraft.conservationLocale}
                                                    onChange={(e) => setNewSeedDraft(prev => ({ ...prev, conservationLocale: e.target.value }))}
                                                    placeholder="e.g. WA / SA"
                                                    className="w-full bg-white border border-slate-200 rounded p-1.5 text-xs outline-none"
                                                />
                                            </div>
                                            <div className="col-span-2">
                                                <label className="block text-[9px] uppercase font-bold text-slate-400 mb-1">Habitat Description</label>
                                                <input 
                                                    type="text" 
                                                    value={newSeedDraft.conservationDesc}
                                                    onChange={(e) => setNewSeedDraft(prev => ({ ...prev, conservationDesc: e.target.value }))}
                                                    className="w-full bg-white border border-slate-200 rounded p-1.5 text-xs outline-none"
                                                />
                                            </div>
                                        </div>

                                        {/* Germination Sowing guidelines */}
                                        <div className="col-span-1 md:col-span-2">
                                            <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Germination Instructions</label>
                                            <textarea 
                                                rows="2"
                                                value={newSeedDraft.germination}
                                                onChange={(e) => setNewSeedDraft(prev => ({ ...prev, germination: e.target.value }))}
                                                className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs"
                                            />
                                        </div>

                                        {/* Image Manual Link Override */}
                                        <div className="col-span-1 md:col-span-2">
                                            <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Image Directory Link (Relative Path or URL)</label>
                                            <input 
                                                type="text" 
                                                value={newSeedDraft.imageUrl}
                                                onChange={(e) => setNewSeedDraft(prev => ({ ...prev, imageUrl: e.target.value }))}
                                                placeholder="images/acacia_victoriae.jpg"
                                                className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs outline-none"
                                            />
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-slate-100 px-6 py-4 flex items-center justify-end gap-3 font-semibold border-t border-slate-200">
                                    <button 
                                        onClick={() => setIsCreationModalOpen(false)} 
                                        className="px-4 py-2 rounded-xl text-slate-500 hover:bg-slate-200 text-sm cursor-pointer border-0 bg-transparent"
                                    >
                                        Cancel
                                    </button>
                                    <button 
                                        onClick={handleSaveNewSeed}
                                        className="px-5 py-2 rounded-xl bg-emerald-800 hover:bg-emerald-700 text-white text-sm cursor-pointer border-0"
                                    >
                                        Save Seed Card
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CUSTOM CONFIRMATION MODALS */}
                    {seedToDelete && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-200">
                                <div className="flex items-center gap-3 text-rose-600 mb-3">
                                    <Icon name="alertCircle" className="h-6 w-6" />
                                    <h3 className="font-bold text-lg text-slate-900">Remove Seed Entry?</h3>
                                </div>
                                <p className="text-slate-600 text-sm mb-6 leading-relaxed">
                                    Are you sure you want to remove <span className="italic font-bold text-slate-900">{seedToDelete.name}</span> from your local seed tracker? This action cannot be undone.
                                </p>
                                <div className="flex items-center justify-end gap-3 font-semibold">
                                    <button onClick={() => setSeedToDelete(null)} className="px-4 py-2 rounded-xl text-slate-500 hover:bg-slate-100 text-sm cursor-pointer border-0 bg-transparent">
                                        Cancel
                                    </button>
                                    <button onClick={confirmDeleteSeed} className="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-sm cursor-pointer border-0">
                                        Delete Entry
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showResetConfirm && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-200">
                                <div className="flex items-center gap-3 text-amber-600 mb-3">
                                    <Icon name="alertCircle" className="h-6 w-6" />
                                    <h3 className="font-bold text-lg text-slate-900">Reset Database?</h3>
                                </div>
                                <p className="text-slate-600 text-sm mb-6 leading-relaxed">
                                    Are you sure you want to restore the tracker back to the default 97 species? This will overwrite your custom field notes, sowing dates, and gallery photo updates.
                                </p>
                                <div className="flex items-center justify-end gap-3 font-semibold">
                                    <button onClick={() => setShowResetConfirm(false)} className="px-4 py-2 rounded-xl text-slate-500 hover:bg-slate-100 text-sm cursor-pointer border-0 bg-transparent">
                                        Cancel
                                    </button>
                                    <button onClick={confirmResetDatabase} className="px-4 py-2 rounded-xl bg-amber-600 hover:bg-amber-700 text-white text-sm cursor-pointer border-0">
                                        Reset All
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
